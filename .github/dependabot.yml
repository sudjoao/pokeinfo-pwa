# Atualizações de segurança e de versão. As de npm saem agrupadas (um PR por semana para as de
# desenvolvimento e outro para as do app); as de segurança chegam na hora, fora do agrupamento.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      app:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
