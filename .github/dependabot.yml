# Atualizações de segurança e de versão. As de npm saem agrupadas (um PR por semana para as de
# desenvolvimento e outro para as do app); as de segurança chegam na hora, fora do agrupamento.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # O TypeScript 7 (reescrito em Go) não tem a API JavaScript que o vue-tsc usa
      # (`typescript/lib/tsc`); testado em 2026-10-30 com vue-tsc 3.3.14. Tirar quando o vue-tsc
      # suportar.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      app:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
